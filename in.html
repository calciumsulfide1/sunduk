<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сундук</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url('https://i.postimg.cc/9fjNChs3/26dce1f47383c05bba49a4140339eec5.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Контейнер сундука */
        .scene {
            position: relative;
            width: 300px;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            cursor: pointer;
        }

        /* Вылетающие фотографии */
        .photos-container {
            position: absolute;
            bottom: 60px;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 1;
        }

        .photo {
            position: absolute;
            width: 140px;
            height: 180px;
            object-fit: cover;
            border: 6px solid #fff;
            border-bottom: 20px solid #fff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border-radius: 4px;
            opacity: 0;
            transform: scale(0.1) translateY(100px);
            transition: all 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Анимация вылета фото при открытии */
        .chest.open ~ .photos-container .photo-1 {
            opacity: 1;
            transform: scale(1) translateY(-140px) rotate(-12deg) translateX(-70px);
            pointer-events: auto;
        }

        .chest.open ~ .photos-container .photo-2 {
            opacity: 1;
            transform: scale(1) translateY(-140px) rotate(12deg) translateX(70px);
            transition-delay: 0.2s;
            pointer-events: auto;
        }

        .photo:hover {
            transform: scale(1.15) translateY(-150px) rotate(0deg) !important;
            z-index: 10;
        }

        /* Векторный сундук */
        .chest {
            position: relative;
            width: 240px;
            height: 160px;
            z-index: 2;
        }

        .chest-base {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 110px;
            background: linear-gradient(135deg, #8B4513, #5c2d0c);
            border: 4px solid #2d1606;
            border-radius: 0 0 15px 15px;
            box-shadow: 0 15px 25px rgba(0,0,0,0.6);
            overflow: hidden;
        }

        .chest-belt {
            position: absolute;
            top: 0;
            width: 24px;
            height: 100%;
            background: #222;
            border-left: 2px solid #ff3333;
            border-right: 2px solid #ff3333;
        }
        .chest-belt-1 { left: 40px; }
        .chest-belt-2 { right: 40px; }

        .chest-lid {
            position: absolute;
            top: 0;
            width: 100%;
            height: 60px;
            background: linear-gradient(135deg, #a0522d, #6e371e);
            border: 4px solid #2d1606;
            border-radius: 15px 15px 0 0;
            transform-origin: top;
            transition: transform 0.8s ease-in-out;
            z-index: 3;
        }

        .chest.open .chest-lid {
            transform: rotateX(-110deg);
        }

        /* Замок */
        .lock {
            position: absolute;
            top: 45px;
            left: 50%;
            transform: translateX(-50%);
            width: 36px;
            height: 44px;
            background: linear-gradient(135deg, #d4af37, #aa820a);
            border: 2px solid #5a4505;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 4;
            transition: opacity 0.5s;
        }
        .lock::before {
            content: '';
            position: absolute;
            top: -16px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 18px;
            border: 4px solid #aa820a;
            border-bottom: none;
            border-radius: 10px 10px 0 0;
        }
        .chest.open .lock {
            opacity: 0;
        }

            top: 0;
            left: 0;

            height: 100vh;
