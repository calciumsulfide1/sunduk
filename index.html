/<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сундук</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url('https://i.postimg.cc/9fjNChs3/26dce1f47383c05bba49a4140339eec5.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Главная сцена */
        .scene {
            position: relative;
            width: 280px;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.9));
        }

        /* Вылетающие фотографии */
        .photos-container {
            position: absolute;
            top: 20px;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 1;
        }

        .photo {
            position: absolute;
            width: 150px;
            height: 190px;
            object-fit: cover;
            border: 6px solid #fff;
            border-bottom: 22px solid #fff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            border-radius: 4px;
            opacity: 0;
            transform: scale(0.1) translateY(80px);
            transition: all 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Анимация вылета фото при открытии */
        .scene.open .photos-container .photo-1 {
            opacity: 1;
            transform: scale(1) translateY(-120px) rotate(-12deg) translateX(-75px);
            pointer-events: auto;
        }

        .scene.open .photos-container .photo-2 {
            opacity: 1;
            transform: scale(1) translateY(-120px) rotate(12deg) translateX(75px);
            transition-delay: 0.2s;
            pointer-events: auto;
        }

        .photo:hover {
            transform: scale(1.15) translateY(-130px) rotate(0deg) !important;
            z-index: 10;
        }

        /* SVG сундук */
        .chest-svg {
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        .chest-lid {
            transform-origin: 140px 75px;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .scene.open .chest-lid {
            transform: rotate(-110deg);
        }

        .chest-lock {
            transition: opacity 0.3s ease;
        }

        .scene.open .chest-lock {
            opacity: 0;
        }

        /* Модальное окно (Черно-красное) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: #0a0a0a;
            border: 2px solid #ff0033;
            box-shadow: 0 0 25px rgba(255, 0, 51, 0.5), inset 0 0 15px rgba(255, 0, 51, 0.1);
            padding: 30px 40px;
            border-radius: 12px;
            text-align: center;
            width: 310px;
        }

        .modal label {
            display: block;
            color: #ff334b;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(255, 51, 75, 0.6);
        }

        .modal input {
            width: 100%;
            padding: 12px;
            background: #141414;
            border: 2px solid #ff0033;
            border-radius: 6px;
            color: #fff;
            font-size: 24px;
            text-align: center;
            letter-spacing: 8px;
            outline: none;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.8);
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .modal input:focus {
            border-color: #ff3366;
            box-shadow: 0 0 12px rgba(255, 51, 102, 0.7);
        }

        .error-msg {
            color: #ff0033;
            font-size: 15px;
            font-weight: 600;
            margin-top: 15px;
            min-height: 20px;
            text-shadow: 0 0 8px rgba(255, 0, 51, 0.6);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        .shake {
            animation: shake 0.4s ease-in-out;
        }
    </style>
</head>
<body>

    <div class="scene" id="scene">
        <!-- SVG сундук -->
        <svg class="chest-svg" viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg">
            <!-- Корпус сундука -->
            <g class="chest-base">
                <rect x="20" y="80" width="240" height="120" rx="10" fill="#7a3b11" stroke="#2b1203" stroke-width="6"/>
                <!-- Внутренность при открытии -->
                <rect x="26" y="86" width="228" height="30" fill="#2d1405"/>
                <!-- Полосы/ремни -->
                <rect x="55" y="80" width="25" height="120" fill="#1f1f1f" stroke="#ff0033" stroke-width="2"/>
                <rect x="200" y="80" width="25" height="120" fill="#1f1f1f" stroke="#ff0033" stroke-width="2"/>
                <!-- Заклепки -->
                <circle cx="67.5" cy="100" r="3" fill="#ff0033"/>
                <circle cx="67.5" cy="140" r="3" fill="#ff0033"/>
                <circle cx="67.5" cy="180" r="3" fill="#ff0033"/>
                <circle cx="212.5" cy="100" r="3" fill="#ff0033"/>
                <circle cx="212.5" cy="140" r="3" fill="#ff0033"/>
                <circle cx="212.5" cy="180" r="3" fill="#ff0033"/>
            </g>

            <!-- Крышка сундука -->
            <g class="chest-lid">
                <path d="M 20 80 Q 140 10 260 80 Z" fill="#9e4e17" stroke="#2b1203" stroke-width="6"/>
                <rect x="55" y="32" width="25" height="48" fill="#1f1f1f" stroke="#ff0033" stroke-width="2"/>
                <rect x="200" y="32" width="25" height="48" fill="#1f1f1f" stroke="#ff0033" stroke-width="2"/>
                <circle cx="67.5" cy="50" r="3" fill="#ff0033"/>
                <circle cx="212.5" cy="50" r="3" fill="#ff0033"/>
            </g>

            <!-- Замок -->
            <g class="chest-lock">
                <path d="M 130 65 A 10 10 0 0 1 150 65 V 75 H 130 Z" fill="none" stroke="#d4af37" stroke-width="4"/>
                <rect x="122" y="73" width="36" height="44" rx="6" fill="#ffd700" stroke="#5a4505" stroke-width="3"/>
                <circle cx="140" cy="90" r="5" fill="#2b1203"/>
                <polygon points="137,92 143,92 141,105 139,105" fill="#2b1203"/>
            </g>
        </svg>

        <div class="photos-container">
            <img src="https://i.postimg.cc/nz2W3PRp/6f66670a-8d95-4b5d-aa83-8229b76c6868.png" alt="Photo 1" class="photo photo-1">
            <img src="https://i.postimg.cc/J4v2YJqH/68d988a6-fb6f-440b-8334-87dfd17e26ea.png" alt="Photo 2" class="photo photo-2">
        </div>
    </div>

    <!-- Модальное окно кода -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalWindow">
            <label for="codeInput">введите код:</label>
            <input type="password" id="codeInput" maxlength="5" autocomplete="off" autofocus>
            <div class="error-msg" id="errorMsg"></div>
        </div>
    </div>

    <script>
        const scene = document.getElementById('scene');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalWindow = document.getElementById('modalWindow');
        const codeInput = document.getElementById('codeInput');
        const errorMsg = document.getElementById('errorMsg');

        let isUnlocked = false;

        scene.addEventListener('click', () => {
            if (!isUnlocked) {
                modalOverlay.classList.add('active');
                codeInput.focus();
            }
        });

        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                modalOverlay.classList.remove('active');
                codeInput.value = '';
                errorMsg.textContent = '';
            }
        });

        codeInput.addEventListener('input', () => {
            errorMsg.textContent = '';
            const val = codeInput.value;

            if (val === '22095') {
                isUnlocked = true;
                modalOverlay.classList.remove('active');
                scene.classList.add('open');
            } else if (val.length === 5) {
                errorMsg.textContent = 'ну ты норм?';
                modalWindow.classList.add('shake');
                setTimeout(() => {
                    modalWindow.classList.remove('shake');
                }, 400);
            }
        });
    </script>
</body>
</html>
