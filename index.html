<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сундук</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Главная сцена */
        .scene {
            position: relative;
            width: 300px;
            height: 240px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        /* Вылетающие фотографии */
        .photos-container {
            position: absolute;
            top: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 1;
        }

        .photo {
            position: absolute;
            width: 150px;
            height: 190px;
            object-fit: cover;
            border: 6px solid #fff;
            border-bottom: 22px solid #fff;
            box-shadow: 0 10px 25px rgba(255,255,255,0.1);
            border-radius: 4px;
            opacity: 0;
            transform: scale(0.1) translateY(80px);
            transition: all 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Анимация вылета фото при открытии */
        .scene.open .photos-container .photo-1 {
            opacity: 1;
            transform: scale(1) translateY(-130px) rotate(-12deg) translateX(-80px);
            pointer-events: auto;
        }

        .scene.open .photos-container .photo-2 {
            opacity: 1;
            transform: scale(1) translateY(-130px) rotate(12deg) translateX(80px);
            transition-delay: 0.2s;
            pointer-events: auto;
        }

        .photo:hover {
            transform: scale(1.15) translateY(-140px) rotate(0deg) !important;
            z-index: 10;
        }

        /* SVG сундук */
        .chest-svg {
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        .chest-lid {
            transform-origin: 150px 85px;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .scene.open .chest-lid {
            transform: rotate(-110deg);
        }

        .chest-lock {
            transition: opacity 0.3s ease;
        }

        .scene.open .chest-lock {
            opacity: 0;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
